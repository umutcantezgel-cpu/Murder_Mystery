<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#0D0F1D">
  <meta name="description" content="Mordakte – kooperatives Murder-Mystery">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mordakte">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mordakte</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#0D0F1D;">
  <div id="mordakte-loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0D0F1D;color:#E8E0D0;font:600 14px/1.4 Georgia,serif;letter-spacing:4px;">
    <div style="width:42px;height:42px;border:3px solid #3a3a52;border-top-color:#C9A227;border-radius:50%;animation:mspin 0.9s linear infinite;"></div>
    <div>MORDAKTE</div>
  </div>
  <style>@keyframes mspin{to{transform:rotate(360deg)}}</style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('mordakte-loading');
      if (el) el.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Ton (flutter_soloud): lädt das WASM-Modul vor dem Start der App. -->
  <script src="assets/packages/flutter_soloud/web/init_soloud.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
