name: mordakte
description: "Mordakte – kooperatives 2.5D-Murder-Mystery."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  barcode: ^2.2.9
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_soloud: 5.1.3
  go_router: ^18.0.2
  intl: ^0.20.3
  krimidinner_kanon:
    path: packages/krimidinner_kanon
  mordakte_core:
    path: packages/mordakte_core
  mordakte_klang:
    path: packages/mordakte_klang
  mordakte_netz:
    path: packages/mordakte_netz
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/lizenzen/
    - assets/klang/
    - content/scenarios/
    - krimidinner/spuk-im-gewoelbe/10_kanon/
    - content/party/akten.json
    - content/karten/
    - content/party/zusatz/schlosskeller/
    - content/party/zusatz/gewoelbe/
    - content/party/zusatz/ravensmoor/
    - content/party/zusatz/nachtexpress/
    - content/party/zusatz/blue_palm/
    - content/party/schlosskeller/
    - content/party/schlosskeller/tatmatrix/
    - content/party/schlosskeller/texte/
    - content/party/gewoelbe/
    - content/party/gewoelbe/texte/
    - content/party/ravensmoor/
    - content/party/ravensmoor/texte/
    - content/party/nachtexpress/
    - content/party/nachtexpress/texte/
    - content/party/blue_palm/
    - content/party/blue_palm/texte/
    - content/welt/schlosskeller/
    - content/welt/gewoelbe/
    - content/welt/ravensmoor/
    - content/welt/nachtexpress/
    - content/welt/blue_palm/
    - content/erzaehlung/
    - content/erzaehlung/ravensmoor/
    - content/erzaehlung/nachtexpress/
    - content/erzaehlung/schlosskeller/
  fonts:
    - family: SpecialElite
      fonts:
        - asset: assets/fonts/SpecialElite-Regular.ttf
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variabel.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variabel.ttf
        - asset: assets/fonts/Lora-Kursiv-Variabel.ttf
          style: italic
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variabel.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
