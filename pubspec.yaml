name: mordakte
description: "Mordakte – kooperatives 2.5D-Murder-Mystery."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  barcode: ^2.2.9
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  intl: ^0.20.3
  feinkorn:
    path: packages/feinkorn
  krimidinner_kanon:
    path: packages/krimidinner_kanon
  mordakte_core:
    path: packages/mordakte_core
  mordakte_netz:
    path: packages/mordakte_netz
  room_host:
    path: packages/room_host
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - content/scenarios/
    - krimidinner/spuk-im-gewoelbe/10_kanon/
    - content/party/akten.json
    - content/karten/
    - content/party/zusatz/schlosskeller/
    - content/party/schlosskeller/
    - content/party/schlosskeller/tatmatrix/
    - content/party/schlosskeller/texte/
    - content/party/ravensmoor/
    - content/party/ravensmoor/texte/
    - content/party/nachtexpress/
    - content/party/nachtexpress/texte/
    - content/party/blue_palm/
    - content/party/blue_palm/texte/
  fonts:
    - family: SpecialElite
      fonts:
        - asset: assets/fonts/SpecialElite-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
